<div class="top-user">

</div>

  <!-- Stats -->
  <div class="course-stats">
    <div class="stat-box">
      <div class="number" id="totalCourses">0</div>
      <div class="label">Total Courses</div>
    </div>
    <div class="stat-box">
      <div class="number" id="totalHours">0h</div>
      <div class="label">Total Hours</div>
    </div>
  </div>

  <div class="card">
    <!-- Add Form -->
    <div class="add-form">
      <input type="text" id="courseName" placeholder="📖 Course Name">
      <input type="number" id="hours" placeholder="⏰ Credit Hours" min="1">
      <button onclick="addCourse()">+ Add Course</button>
    </div>

    <!-- Table -->
    <table id="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Course Name</th>
          <th>Credit Hours</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="emptyMsg" style="display: none;">
      <span>📚</span>
      <p>No courses added yet. Start by adding your first course!</p>
    </div>
  </div>
</div>

<script>
let courses = JSON.parse(localStorage.getItem("courses")) || [];
let nextId = courses.length > 0 ? Math.max(...courses.map(c => c.id)) + 1 : 1;

function isDuplicate(name, excludeId = null) {
  return courses.some(c =>
    c.name.toLowerCase() === name.toLowerCase() && c.id !== excludeId
  );
}

function updateStats() {
  document.getElementById("totalCourses").innerText = courses.length;
  const totalHours = courses.reduce((sum, c) => sum + c.hours, 0);
  document.getElementById("totalHours").innerText = totalHours + "h";
}
function showToast(message, type = "success") {

 const toast = document.createElement("div");

 toast.className = `toast ${type}`;
 toast.textContent = message;

 document.body.appendChild(toast);

 setTimeout(() => {
  toast.classList.add("show");
 }, 100);

 setTimeout(() => {
  toast.classList.remove("show");

  setTimeout(() => {
   toast.remove();
  }, 300);

 }, 3000);
}

function render() {

 const tbody = document.querySelector("#table tbody");

 tbody.innerHTML = "";

 if (courses.length === 0) {

  document.getElementById("emptyMsg").style.display = "block";

  document.querySelector("#table thead").style.display = "none";

 } else {

  document.getElementById("emptyMsg").style.display = "none";

  document.querySelector("#table thead").style.display = "";

 }

 courses.forEach((c, index) => {

  const row = document.createElement("tr");

  row.innerHTML = `
   <td>${index + 1}</td>

   <td>
    <span 
      class="editable-course"
      ondblclick="enableEdit(${c.id}, this)"
    >
      ${c.name}
    </span>
   </td>

   <td>${c.hours}h</td>

   <td>
    <button class="btn-delete" onclick="deleteCourse(${c.id})">
      🗑 Delete
    </button>
   </td>
  `;

  tbody.appendChild(row);

 });

 updateStats();
}
function addCourse() {
  const name = document.getElementById("courseName").value.trim();
  const hours = parseInt(document.getElementById("hours").value);

if (!name || isNaN(hours) || hours <= 0) {
 showToast("Please enter valid course name and hours", "error");
 return;
}

if (isDuplicate(name)) {
 showToast("This course already exists!", "error");
 return;
}

  courses.push({ id: nextId++, name, hours });
  localStorage.setItem("courses", JSON.stringify(courses));

  document.getElementById("courseName").value = "";
  document.getElementById("hours").value = "";

  render();
}

function deleteCourse(id) {

 const confirmed = confirm("Delete this course?");

 if (!confirmed) return;

 courses = courses.filter(c => c.id !== id);

 localStorage.setItem("courses", JSON.stringify(courses));

 showToast("Course deleted successfully", "success");

 render();
}

function enableEdit(id, element) {

 const course = courses.find(c => c.id === id);

 element.innerHTML = `
  <input 
    type="text" 
    id="editInput-${id}" 
    value="${course.name}"
    class="edit-input"
    onblur="saveCourse(${id})"
    onkeypress="handleKey(event, ${id})"
    autofocus
  >
 `;
}

function handleKey(event, id) {
 if (event.key === "Enter") {
  saveCourse(id);
 }
}

function saveCourse(id) {

 const input = document.getElementById(`editInput-${id}`);
 let newName = input.value.trim();

 const course = courses.find(c => c.id === id);

 if (!newName) {
  showToast("Course name cannot be empty", "error");
  render();
  return;
 }

 if (isDuplicate(newName, id)) {
  showToast("This course already exists!", "error");
  render();
  return;
 }

 course.name = newName;

 localStorage.setItem("courses", JSON.stringify(courses));

 showToast("Course updated successfully", "success");

 render();
}

render();
</script>
