<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Courses</title>
<link rel="stylesheet" href="style.css">
</head>

<body onload="loadUserProfile();">

<div class="sidebar">
  <h2>Study Planner</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="courses.html" class="active">Courses</a>
  <a href="deadlines.html">Deadlines</a>
  <a href="availability.html">Weekly Plan</a>
  <a href="statistics.html">Statistics</a>
  <a href="index.html">Log out</a>
</div>

<div class="main">
  <h1>📚 Courses</h1>
  <div class="top-user">
    <span id="userNameDisplay"></span>
    <img id="userAvatar" class="user-avatar" src="female.png" alt="User">
  </div>

  <div class="course-stats">
    <div class="stat-box">
      <div class="number" id="totalCourses">0</div>
      <div class="label">Total Courses</div>
    </div>
  </div>

  <div class="card">
    <div class="add-form">
      <input type="text" id="courseName" placeholder="📖 Course Name">
      <button onclick="addCourse()">+ Add Course</button>
    </div>

    <table id="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Course Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="emptyMsg" class="empty-hidden">
      <span>📚</span>
      <p>No courses added yet. Start by adding your first course!</p>
    </div>
  </div>
</div>

<script>
let courses = JSON.parse(localStorage.getItem("courses")) || [];
let nextId = courses.length > 0 ? Math.max(...courses.map(c => c.id)) + 1 : 1;

function isDuplicate(name, excludeId = null) {
  return courses.some(c =>
    c.name.toLowerCase() === name.toLowerCase() && c.id !== excludeId
  );
}

function updateStats() {
  document.getElementById("totalCourses").innerText = courses.length;
}

function showToast(message, type = "success") {
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.classList.add("show");
  }, 100);
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => {
      toast.remove();
    }, 300);
  }, 3000);
}

function render() {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  if (courses.length === 0) {
    document.getElementById("emptyMsg").style.display = "block";
    document.querySelector("#table thead").style.display = "none";
  } else {
    document.getElementById("emptyMsg").style.display = "none";
    document.querySelector("#table thead").style.display = "";
  }

  courses.forEach((c, index) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${index + 1}</td>
      <td>
        <span class="editable-course" ondblclick="enableEdit(${c.id}, this)">
          ${c.name}
        </span>
      </td>
      <td>
        <button class="btn-delete" onclick="deleteCourse(${c.id})">🗑 Delete</button>
      </td>
    `;
    tbody.appendChild(row);
  });

  updateStats();
}

function addCourse() {
  const name = document.getElementById("courseName").value.trim();

  if (!name) {
    showToast("Please enter a valid course name", "error");
    return;
  }

  if (isDuplicate(name)) {
    showToast("This course already exists!", "error");
    return;
  }

  courses.push({ id: nextId++, name });
  localStorage.setItem("courses", JSON.stringify(courses));
  document.getElementById("courseName").value = "";
  render();
}

function deleteCourse(id) {
  showConfirm("Delete this course?", function() {
    courses = courses.filter(c => c.id !== id);
    localStorage.setItem("courses", JSON.stringify(courses));
    showToast("Course deleted successfully", "success");
    render();
  });
}

function enableEdit(id, element) {
  const course = courses.find(c => c.id === id);
  element.innerHTML = `
    <input
      type="text"
      id="editInput-${id}"
      value="${course.name}"
      class="edit-input"
      onblur="saveCourse(${id})"
      onkeypress="handleKey(event, ${id})"
      autofocus
    >
  `;
}

function handleKey(event, id) {
  if (event.key === "Enter") {
    saveCourse(id);
  }
}

function saveCourse(id) {
  const input = document.getElementById(`editInput-${id}`);
  let newName = input.value.trim();
  const course = courses.find(c => c.id === id);

  if (!newName) {
    showToast("Course name cannot be empty", "error");
    render();
    return;
  }

  if (isDuplicate(newName, id)) {
    showToast("This course already exists!", "error");
    render();
    return;
  }

  course.name = newName;
  localStorage.setItem("courses", JSON.stringify(courses));
  showToast("Course updated successfully", "success");
  render();
}

let modalCallback = null;

function showConfirm(message, callback) {
  document.getElementById("modalMessage").textContent = message;
  document.getElementById("confirmModal").classList.add("active");
  document.getElementById("confirmBtn").onclick = function() {
    closeModal();
    callback();
  };
}

function closeModal() {
  document.getElementById("confirmModal").classList.remove("active");
  modalCallback = null;
}

render();
</script>

<script src="script.js"></script>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <p id="modalMessage">Are you sure?</p>
    <div class="modal-buttons">
      <button class="modal-btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn-confirm" id="confirmBtn">OK</button>
    </div>
  </div>
</div>

</body>
</html>
