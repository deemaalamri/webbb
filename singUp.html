<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Sign Up</title>

<link rel="stylesheet" href="styleLogin.css">
</head>

<body>

<div class="container" id="main-container">

  <input type="checkbox" id="toggle">

  <!-- MESSAGE -->
  <div id="message" class="message"></div>

  <!-- LOGIN -->
  <div class="form-box login">
    <h2>Login</h2>

    <input type="text" id="login-username" placeholder="Username">
    <input type="password" id="login-password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <p>
      Don't have an account?
      <label for="toggle">Sign Up</label>
    </p>
  </div>

  <!-- SIGNUP -->
  <div class="form-box signup">
    <h2>Sign Up</h2>

    <input type="text" id="reg-username" placeholder="Username">
    <input type="email" id="reg-email" placeholder="@gmail.com">
    <input type="tel" id="reg-phone" placeholder="Phone Number">
    <input type="password" id="reg-password" placeholder="Password">

    <button id="registerBtn">Register</button>

    <p>
      Already have an account?
      <label for="toggle">Login</label>
    </p>
  </div>

  <!-- SIDE -->
  <div class="side">
    <div class="text login-text">
      <h2>WELCOME BACK!</h2>
      <p>We are happy to see you again.</p>
    </div>

    <div class="text signup-text">
      <h2>HELLO FRIEND!</h2>
      <p>Create your account and start your journey.</p>
    </div>
  </div>

</div>

<script>
function showMessage(text, type){
  const msg = document.getElementById("message");
  msg.innerText = text;
  msg.className = "message " + type;

  setTimeout(() => msg.classList.add("show"), 50);
  setTimeout(() => msg.classList.remove("show"), 2000);
  setTimeout(() => msg.innerText = "", 2500);
}

/* EMAIL VALIDATION */
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/* SAUDI PHONE VALIDATION */
function isValidPhone(phone){
  return /^05\d{8}$/.test(phone);
}

/* ================= REGISTER ================= */
document.getElementById("registerBtn").addEventListener("click", () => {

  const username = document.getElementById("reg-username").value.trim();
  const email = document.getElementById("reg-email").value.trim();
  const phone = document.getElementById("reg-phone").value.trim();
  const password = document.getElementById("reg-password").value;

  if(!username || !email || !phone || !password){
    return showMessage("Please fill in all fields", "error");
  }

  if(!isValidEmail(email)){
    return showMessage("Invalid email address", "error");
  }

  if(!phone.startsWith("05")){
    return showMessage("Phone number must start with 05", "error");
  }

  if(phone.length !== 10){
    return showMessage("Phone number must be 10 digits", "error");
  }

  localStorage.setItem("user", JSON.stringify({username,email,phone,password}));

  localStorage.setItem("loggedInUser", username);

  showMessage("Registration successful", "success");

  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 1200);
});

/* ================= LOGIN ================= */
document.getElementById("loginBtn").addEventListener("click", () => {

  const username = document.getElementById("login-username").value;
  const password = document.getElementById("login-password").value;
  const saved = JSON.parse(localStorage.getItem("user"));

  if(!saved){
    return showMessage("No account found, please register first", "error");
  }

  if(username === saved.username && password === saved.password){

    localStorage.setItem("loggedInUser", username);

    showMessage("Login successful", "success");

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1200);

  } else {
    showMessage("Incorrect username or password", "error");
  }
});
</script>

</body>
</html>
